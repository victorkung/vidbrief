<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070707" />
    <meta name="color-scheme" content="dark" />

    <!-- Primary SEO -->
    <title>VidBrief: any video, briefed. Free, local, open source.</title>
    <meta name="description" content="Paste a YouTube or X link. VidBrief writes a tight, timestamped brief and reads it to you, entirely on your Mac. No API keys, no cost, open source." />
    <meta name="keywords" content="VidBrief, video summary, YouTube summary, podcast summary, local AI, MLX, Whisper, Kokoro, open source, Apple Silicon, PodBrief" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://vidbrief.io/" />

    <!-- Open Graph -->
    <meta property="og:title" content="VidBrief: any video, briefed." />
    <meta property="og:description" content="Timestamped briefs of YouTube and X videos, written and read aloud entirely on your Mac. Free and open source." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vidbrief.io/" />
    <meta property="og:site_name" content="VidBrief" />
    <meta property="og:image" content="https://vidbrief.io/opengraph.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VidBrief: any video, briefed." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VidBrief: any video, briefed." />
    <meta name="twitter:description" content="Timestamped briefs of YouTube and X videos, written and read aloud entirely on your Mac. Free and open source." />
    <meta name="twitter:image" content="https://vidbrief.io/opengraph.png" />
    <meta name="twitter:image:alt" content="VidBrief: any video, briefed." />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "VidBrief",
        "operatingSystem": "macOS (Apple Silicon)",
        "applicationCategory": "ProductivityApplication",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Turn any YouTube or X video into a timestamped executive brief, written and read aloud entirely on your Mac.",
        "url": "https://vidbrief.io/",
        "downloadUrl": "https://github.com/victorkung/vidbrief",
        "license": "https://opensource.org/licenses/MIT"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
